ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    two_d_mode: false
    publish_tf: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    #x     , y     , z,
    #roll  , pitch , yaw,
    #vx    , vy    , vz,
    #vroll , vpitch, vyaw,
    #ax    , ay    , az
    odom0: odom/data_raw
    odom0_config:
      [
        false, false, false,
        false, false, false,
        true,  false, false,
        false, false, false,
        false, false, false,
      ]

    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
    imu0: imu/data_raw
    imu0_config:
      [
        false, false, false,
        true, true, true,
        false, false, false,
        true, true, true,
        true,  false, false,
      ]