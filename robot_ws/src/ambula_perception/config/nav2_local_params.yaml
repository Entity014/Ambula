# nav2_local_params.yaml (ปรับตามความต้องการ)
bt_navigator:
  ros__parameters:
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    global_costmap_topic: global_costmap/costmap_raw
    global_costmap_server: global_costmap/global_costmap
    local_costmap_topic: local_costmap/costmap_raw
    local_costmap_server: local_costmap/local_costmap

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4.0
      height: 4.0
      resolution: 0.05
      robot_radius: 0.25  # ปรับตามขนาดหุ่นยนต์จริง (หน่วยเมตร)
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: depth_points
        depth_points:
          topic: /camera/camera/depth/color/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          max_obstacle_height: 1.8
          min_obstacle_height: 0.15 # ตัด Noise ที่พื้นออก
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55



planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

# ส่วนการควบคุม (Controller) สำหรับการเคลื่อนที่
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      max_wheel_acceleration: 1.0

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["Spin", "Backup", "Wait"]
    Spin:
      plugin: "nav2_behaviors/Spin"
    Backup:
      plugin: "nav2_behaviors/BackUp"
    Wait:
      plugin: "nav2_behaviors/Wait"

# ไม่ใช้ global_costmap เพราะ local ล้วน (หรือ comment ออก)
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: []  # ว่างไว้ถ้าไม่ใช้ global