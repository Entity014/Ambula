wbc_node:
  ros__parameters:
    # ======================================================
    # Paths and System
    # ======================================================
    urdf_path: "/home/robot_ws/src/ambula_simulation/ambula_description/urdf/ambula_bot_v3/ambula.urdf"
    control_rate_hz: 200.0
    publish_all_joints: true
    non_actuated_effort_mode: "zero"

    # ======================================================
    # WBC Weights
    # ======================================================
    weight_height:  0.0
    weight_roll:    0.0  
    weight_posture: 15.0   # ดึงขากลับ IK reference (Hip + Knee)

    # ======================================================
    # PD Gains — Height Task
    # ======================================================
    kp_z:  0.0
    kd_z:  0.0

    # ======================================================
    # PD Gains — Roll Task
    # ======================================================
    kp_roll: 0.0
    kd_roll: 0.0

    # ======================================================
    # PD Gains — Posture (Hip vs Knee แยกกัน)
    # ======================================================
    kp_hip:  350.0   # Hip ดึงกลับแรง รับโหลดแทน Knee
    kd_hip:   35.0
    kp_knee:  60.0   # Knee นิ่ม  (kd ≈ 2√kp → critically damped)
    kd_knee:  15.5   # 2*sqrt(50) ≈ 14.1

    # ======================================================
    # Hardware / Contact Constraints
    # ======================================================
    tau_limit:   40.0
    friction_mu:  0.6

    # ======================================================
    # Per-joint torque limits (override จาก URDF)
    # ======================================================
    tau_limits: []
    tau_override: "left_waist_joint:20,left_hip_joint:40,left_knee_joint:20,right_waist_joint:20,right_hip_joint:40,right_knee_joint:20"

    # ======================================================
    # Load Sharing — tau regularization weights
    # knee_tau_scale สูง → solver หลีกเลี่ยง knee torque → hip รับโหลด
    # ======================================================
    knee_tau_scale:  12.0
    hip_tau_scale:    1.0
    waist_tau_scale:  5.0

    # ======================================================
    # Posture acceleration clip
    # ======================================================
    posture_qdd_clip: 250.0

    # ======================================================
    # Knee Spiral Torsion Spring (virtual parallel spring)
    # ======================================================
    knee_spring_k:         0.0    # Nm/rad — เบาพอ ไม่สร้าง oscillation
    knee_spring_b:         0.0    # Nm·s/rad — damping คู่กับ spring
    knee_spring_q0_left:   0.0     # ตามค่าที่ left_knee กำลังถูกสั่ง
    knee_spring_q0_right:  0.0     # ต้องลบ!
    knee_spring_sign_left:  0.0
    knee_spring_sign_right: 0.0    # หรือลอง 1.0 ถ้ายังไม่สมดุล

    # ======================================================
    # Robustness
    # ======================================================
    w_roll_slack: 10000.0
    alpha_bg:        20.0   # Baumgarte gain สำหรับ rolling constraint

    height_boost_enable: true
    height_boost_duration: 0.6
    height_boost_kp_mult: 1.0
    height_boost_w_mult: 1.0
    height_boost_zdd_clip: 100.0
    height_boost_knee_tau_scale: 1.0
    height_boost_tau_override: "left_knee_joint:40,right_knee_joint:40"